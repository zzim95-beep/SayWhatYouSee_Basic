<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>보이는 대로 말해요 · 프롬프트 맞추기</title>
<style>
:root{--bg:#f4f1fb;--card:#fff;--tx:#1b1840;--mu:#645f86;--pr:#3b2fd1;--hi:#ffe14d;--ok:#12803c;--no:#c62828;--bd:#ddd8f0;color-scheme:light dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12102b;--card:#1d1a42;--tx:#f0eeff;--mu:#a9a4d3;--pr:#8f86ff;--ok:#4ade80;--no:#ff7b7b;--bd:#37336a}}
:root[data-theme="dark"]{--bg:#12102b;--card:#1d1a42;--tx:#f0eeff;--mu:#a9a4d3;--pr:#8f86ff;--ok:#4ade80;--no:#ff7b7b;--bd:#37336a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',system-ui,sans-serif;line-height:1.55}
.w{max-width:680px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:12px}
h1{font-size:1.7rem;line-height:1.25;margin:0 0 8px}
h1 mark{background:var(--hi);color:#1b1840;padding:0 6px;border-radius:4px}
p{margin:6px 0}.mu{color:var(--mu);font-size:.92rem}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:700}
.sw{font-variant-numeric:tabular-nums;font-size:1.4rem;color:var(--pr)}
.img{border-radius:10px;overflow:hidden;border:1px solid var(--bd)}
svg{display:block;width:100%;height:auto}
textarea{width:100%;min-height:96px;margin-top:12px;padding:12px;border-radius:10px;border:2px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit;resize:vertical}
textarea:focus-visible,button:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:12px 20px;background:var(--pr);color:#fff;cursor:pointer}
button.s{background:var(--bd);color:var(--tx)}
button:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 2px}
.chip{padding:3px 11px;border-radius:99px;border:1px solid var(--bd);font-size:.85rem;color:var(--mu)}
.chip.y{background:var(--ok);color:#fff;border-color:var(--ok)}
.chip.n{border-color:var(--no);color:var(--no);font-weight:700}
.bar{height:14px;background:var(--bd);border-radius:99px;position:relative;margin:14px 0 6px}
.bar i{display:block;height:100%;width:0;border-radius:99px;background:var(--pr);transition:width .5s}
.bar b{position:absolute;top:-4px;bottom:-4px;width:3px;background:var(--tx);border-radius:2px}
.msg{font-weight:700;margin-top:6px}.msg.y{color:var(--ok)}.msg.n{color:var(--no)}
.sc{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.9rem}td,th{padding:6px;border-bottom:1px solid var(--bd);text-align:center;white-space:nowrap}
.big{font-size:2.6rem;font-weight:800;color:var(--pr);font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="w">

<div id="s0" class="card">
  <h1>보이는 대로 <mark>말해요</mark> 👀</h1>
  <p>그림을 보고, 친구에게 설명하듯이 자세한 문장을 써 보세요. 그림에 있는 특징을 많이 찾아낼수록 점수가 올라가요!</p>
  <p class="mu">💡 힌트: 주인공, 색깔, 장소, 시간, 주변 물건들을 적어보세요.</p>
  <div class="sc"><table>
    <tr><th>진행 단계</th><th>통과 점수 (일치율)</th></tr>
    <tr><td>총 3단계</td><td>70% 이상</td></tr>
  </table></div>
  <p class="mu">채점 방식: 그림에 꼭 들어가야 하는 단어가 내 문장에 들어 있는지 확인해요. 70점만 넘으면 다음으로 넘어갈 수 있어요!</p>
  <div class="row"><button id="b0">시작하기 🚀</button></div>
</div>

<div id="s1" hidden>
  <div class="card top"><span id="lv"></span><span class="sw" id="sw">00:00</span><span>통과 <span id="need"></span></span></div>
  <div class="card">
    <div class="img" id="img"></div>
    <p class="mu" style="margin-top:10px">👇 이 그림에서 찾아야 할 힌트 단어들</p>
    <div class="chips" id="chips"></div>
    <textarea id="in" placeholder="예) 파란 하늘 아래 초록 잔디밭에 예쁜 집이 있어요." aria-label="프롬프트 입력"></textarea>
    <div class="row"><button id="go">확인하기 ✔️</button><button id="nx" hidden>다음 단계 ➡️</button></div>
    <div class="bar" id="bar" hidden><i id="fill"></i><b id="mark"></b></div>
    <div class="msg" id="msg" aria-live="polite"></div>
  </div>
</div>

<div id="s2" class="card" hidden>
  <h1>🎉 3단계 모두 완료! 🎉</h1>
  <p class="mu">전체 걸린 시간</p>
  <div class="big" id="tot"></div>
  <p id="sum"></p>
  <div class="sc"><table id="tb"></table></div>
  <div class="row"><button id="re">처음부터 다시 하기 🔄</button></div>
</div>

</div>
<script>
const $=id=>document.getElementById(id);
const c=(x,y,r,f)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${f}"/>`;
const r=(x,y,w,h,f,q=0)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${q}" fill="${f}"/>`;
const e=(x,y,a,b,f)=>`<ellipse cx="${x}" cy="${y}" rx="${a}" ry="${b}" fill="${f}"/>`;
const p=(t,f)=>`<polygon points="${t}" fill="${f}"/>`;
const d=(t,f,s='none',w=0)=>`<path d="${t}" fill="${f}" stroke="${s}" stroke-width="${w}" stroke-linecap="round"/>`;
const dots=(n,m)=>[...Array(n)].map((_,i)=>c((i*83+20)%400,(i*47+11)%m,2.2,'#fff')).join('');

// 초등학생을 위해 복잡한 조사 정규식 대신, 단순하게 포함 여부만 체크하도록 변경
const hit = (t, x) => new RegExp(x[1]).test(t);

// 가장 쉬운 3가지 그림만 남기고, 통과 기준을 70%로 통일
const L=[
{need:70,svg:()=>r(0,0,400,260,'#efe2c8')+r(0,170,400,90,'#a8743f')+e(200,200,115,26,'#fff')+e(200,192,75,14,'#e6e6e6')+c(200,140,46,'#d62828')+c(186,125,8,'#ef6a5a')+r(197,84,6,18,'#5b3a1a')+d('M203 92q26-18 38-4q-16 18-38 4z','#3a9d3a'),
 e:[['주인공','사과'],['색깔','빨[간강]|붉|빨개|레드'],['놓인 곳','접시|그릇|쟁반'],['배경','탁자|테이블|식탁|책상']]},
{need:70,svg:()=>r(0,0,400,260,'#8fd3ff')+c(330,50,28,'#ffd23f')+e(70,50,34,14,'#fff')+e(100,58,30,12,'#fff')+r(0,190,400,70,'#5cb85c')+r(110,130,110,70,'#f4e3c1')+p('100,130 165,80 230,130','#c0392b')+r(150,160,28,40,'#8d5524')+r(190,145,22,22,'#8fd3ff')+r(292,130,16,70,'#7b4a1e')+c(300,105,40,'#2e8b57'),
 e:[['건물','집|주택|지붕'],['식물','나무'],['하늘의 것','해|태양|햇빛'],['땅','잔디|풀|초원|들판|마당'],['하늘','하늘|파란|푸른']]},
{need:70,svg:()=>r(0,0,400,260,'#b9d4ea')+r(0,185,400,75,'#e4eef7')+dots(30,180)+r(290,125,80,65,'#b5651d')+p('280,125 330,82 380,125','#fff')+r(305,150,18,18,'#ffd23f')+r(340,155,16,35,'#6b3e1e')+c(130,188,34,'#fff')+c(130,142,24,'#fff')+c(130,106,17,'#fff')+r(118,78,24,16,'#222')+r(110,92,40,4,'#222')+r(115,121,30,7,'#d62828')+p('130,106 150,110 130,113','#f77f00')+c(124,102,2,'#000')+c(136,102,2,'#000')+c(215,160,11,'#f2c29b')+r(205,171,20,30,'#e76f51',4)+r(207,200,6,14,'#333')+r(217,200,6,14,'#333')+c(252,165,11,'#f2c29b')+d('M241 162q11-18 22 0z','#e63946')+r(242,176,20,28,'#457b9d',4)+r(244,204,6,12,'#333')+r(254,204,6,12,'#333'),
 e:[['주인공','눈사람'],['날씨','눈이|눈을|눈송이|함박눈|눈발|내리|쌓인|겨울'],['사람','아이|어린이|소년|소녀|친구'],['목도리','목도리|머플러|스카프'],['모자','모자'],['마을','집|마을|지붕']]}
];

let lv=0,t0=0,tk,lt,st=[],done=false;
const fmt=ms=>{const s=Math.floor(ms/1000);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
const show=n=>['s0','s1','s2'].forEach((k,i)=>$(k).hidden=i!=n);

function start(){
  st=L.map(()=>({tries:0,best:0,ms:0}));lv=0;t0=Date.now();clearInterval(tk);
  $('sw').textContent='00:00';
  tk=setInterval(()=>$('sw').textContent=fmt(Date.now()-t0),250);
  show(1);load();
}
function load(){
  const l=L[lv];lt=Date.now();done=false;
  $('lv').textContent=`${lv+1} / 3 단계`;$('need').textContent=l.need+'%';
  $('img').innerHTML=`<svg viewBox="0 0 400 260" role="img" aria-label="맞춰야 할 그림">${l.svg()}</svg>`;
  $('chips').innerHTML=l.e.map(x=>`<span class="chip">${x[0]}</span>`).join('');
  $('in').value='';$('in').disabled=false;$('go').disabled=false;
  $('nx').hidden=true;$('bar').hidden=true;$('msg').textContent='';$('msg').className='msg';
  $('in').focus();
}
function check(){
  const l=L[lv],t=$('in').value.trim();
  if(t.length<5){$('msg').className='msg n';$('msg').textContent='조금만 더 길게 써볼까요? (5글자 이상)';return}
  const res=l.e.map(x=>hit(t,x)),n=res.filter(Boolean).length,sc=Math.round(n/l.e.length*100),s=st[lv];
  s.tries++;s.best=Math.max(s.best,sc);
  $('chips').innerHTML=l.e.map((x,i)=>`<span class="chip ${res[i]?'y':'n'}">${res[i]?'✓':'✗'} ${x[0]}</span>`).join('');
  $('bar').hidden=false;$('fill').style.width=sc+'%';$('mark').style.left=`calc(${l.need}% - 1px)`;
  const m=$('msg');
  if(sc>=l.need){
    done=true;s.ms=Date.now()-lt;
    m.className='msg y';m.textContent=`일치율 ${sc}% — 참 잘했어요! 통과! (${n}/${l.e.length}개 요소 발견)`;
    $('in').disabled=true;$('go').disabled=true;
    $('nx').textContent=lv==2?'결과 보기 🏆':'다음 단계 ➡️';$('nx').hidden=false;$('nx').focus();
  }else{
    m.className='msg n';m.textContent=`일치율 ${sc}% — 통과 점수(${l.need}%)에 조금 부족해요. ✗ 표시된 단어들을 문장에 넣어보세요!`;
  }
}
function next(){
  if(lv<2){lv++;load();return}
  clearInterval(tk);const tot=Date.now()-t0;
  const avg=Math.round(st.reduce((a,b)=>a+b.best,0)/3),tr=st.reduce((a,b)=>a+b.tries,0);
  $('tot').textContent=fmt(tot);
  $('sum').textContent=`평균 일치율 ${avg}% · 확인 ${tr}번 (최소 3번) — ${tr<=4?'최고의 관찰력! 🥇':tr<=7?'아주 잘했어요! 🥈':'포기하지 않고 해낸 도전왕! 🥉'}`;
  $('tb').innerHTML='<tr><th>단계</th><th>통과선</th><th>내 최고점</th><th>시도 횟수</th><th>걸린 시간</th></tr>'+st.map((s,i)=>`<tr><td>${i+1}</td><td>${L[i].need}%</td><td>${s.best}%</td><td>${s.tries}번</td><td>${fmt(s.ms)}</td></tr>`).join('');
  show(2);
}
$('b0').onclick=start;$('re').onclick=start;$('go').onclick=check;$('nx').onclick=next;
$('in').addEventListener('keydown',ev=>{if(ev.key==='Enter'&&(ev.ctrlKey||ev.metaKey)&&!done)check()});
</script>
</body>
</html>
